<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>iSpy Clone</title>
<style>
*{margin:0;padding:0}
body{background:#000;overflow:hidden;display:flex;justify-content:center;align-items:center;height:100vh}
canvas{background:#0a0a0a}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
c.width=1200;c.height=600;

let player={x:150,y:450,w:40,h:40,vy:0,jumping:false,rot:0};
let eye={x:900,y:200,r:120,phase:'idle',timer:0,attackTimer:0,pulse:0,veins:[]};
let obstacles=[],particles=[],bgParticles=[];
let score=0,gameOver=false,gameStarted=false,frame=0;
let keys={};

// Создаём вены для глаза
for(let i=0;i<12;i++){
  eye.veins.push({angle:Math.random()*Math.PI*2,length:Math.random()*40+30,width:Math.random()*2+1});
}

// Фоновые частицы
for(let i=0;i<50;i++){
  bgParticles.push({x:Math.random()*c.width,y:Math.random()*c.height,speed:Math.random()*0.5+0.2,size:Math.random()*2+1});
}

document.onkeydown=e=>{keys[e.code]=true;if(e.code=='Space')e.preventDefault()};
document.onkeyup=e=>keys[e.code]=false;
c.onclick=()=>{if(!gameStarted)gameStarted=true;else if(gameOver)resetGame()};

function resetGame(){
  player={x:150,y:450,w:40,h:40,vy:0,jumping:false,rot:0};
  obstacles=[];particles=[];score=0;gameOver=false;
  eye.phase='idle';eye.timer=0;
  gameStarted=true;
}

function update(){
  if(!gameStarted||gameOver)return;
  frame++;
  
  // Управление
  if((keys['Space']||keys['ArrowUp'])&&player.y>=450){
    player.vy=-15;
    player.jumping=true;
    for(let i=0;i<10;i++){
      particles.push({x:player.x+player.w/2,y:player.y+player.h,vx:(Math.random()-0.5)*3,vy:Math.random()*2,life:30,color:'#0ff'});
    }
  }
  
  // Физика
  player.vy+=0.8;
  player.y+=player.vy;
  if(player.y>=450){player.y=450;player.vy=0;player.jumping=false}
  
  // Вращение
  if(player.jumping)player.rot+=5;
  else player.rot=0;
  
  // Логика глаза
  eye.timer++;
  eye.pulse=Math.sin(frame*0.1)*10;
  
  if(eye.phase==='idle'&&eye.timer>180){
    eye.phase='warning';eye.timer=0;
  }else if(eye.phase==='warning'&&eye.timer>40){
    eye.phase='attack';eye.timer=0;
    // Создаём атаку
    let attackType=Math.random();
    if(attackType<0.3){
      // Лазер
      obstacles.push({type:'laser',x:eye.x,y:eye.y,w:c.width,h:20,life:60});
    }else if(attackType<0.6){
      // Шипы
      for(let i=0;i<5;i++){
        obstacles.push({type:'spike',x:c.width+i*80,y:490,w:40,h:40,vx:-8});
      }
    }else{
      // Волна
      obstacles.push({type:'wave',x:c.width,y:350,w:50,h:50,vx:-10,vy:0,gravity:0.5});
    }
  }else if(eye.phase==='attack'&&eye.timer>80){
    eye.phase='idle';eye.timer=0;
  }
  
  // Обновление препятствий
  for(let i=obstacles.length-1;i>=0;i--){
    let o=obstacles[i];
    if(o.type==='laser'){
      o.life--;
      if(o.life<=0)obstacles.splice(i,1);
    }else if(o.type==='wave'){
      o.vy+=o.gravity;
      o.y+=o.vy;
      if(o.y>490){o.y=490;o.vy=-12}
      o.x+=o.vx;
      if(o.x<-100)obstacles.splice(i,1);
    }else{
      o.x+=o.vx;
      if(o.x<-100)obstacles.splice(i,1);
    }
    
    // Столкновения
    if(o.type==='laser'){
      if(player.y<o.y+o.h&&player.y+player.h>o.y&&player.x+player.w>0){
        gameOver=true;
        createExplosion();
      }
    }else{
      if(player.x<o.x+o.w&&player.x+player.w>o.x&&player.y<o.y+o.h&&player.y+player.h>o.y){
        gameOver=true;
        createExplosion();
      }
    }
    
    if(o.type!=='laser'&&o.x<-100){
      obstacles.splice(i,1);
      score++;
    }
  }
  
  // Частицы
  for(let i=particles.length-1;i>=0;i--){
    let p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.life<=0)particles.splice(i,1);
  }
  
  // Фоновые частицы
  bgParticles.forEach(p=>{
    p.x-=p.speed;
    if(p.x<0)p.x=c.width;
  });
}

function createExplosion(){
  for(let i=0;i<50;i++){
    particles.push({
      x:player.x+player.w/2,y:player.y+player.h/2,
      vx:(Math.random()-0.5)*15,vy:(Math.random()-0.5)*15,
      life:60,color:'#f00'
    });
  }
}

function draw(){
  // Фон
  let grad=ctx.createLinearGradient(0,0,0,c.height);
  grad.addColorStop(0,'#0a0a1a');
  grad.addColorStop(1,'#1a0a2e');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,c.width,c.height);
  
  // Фоновые частицы
  ctx.fillStyle='rgba(0,255,255,0.3)';
  bgParticles.forEach(p=>{
    ctx.fillRect(p.x,p.y,p.size,p.size);
  });
  
  // Сетка
  ctx.strokeStyle='rgba(0,255,255,0.05)';
  ctx.lineWidth=1;
  for(let i=0;i<c.width;i+=60){
    ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,c.height);ctx.stroke();
  }
  for(let i=0;i<c.height;i+=60){
    ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(c.width,i);ctx.stroke();
  }
  
  // Пол
  ctx.fillStyle='#1a1a2e';
  ctx.fillRect(0,530,c.width,70);
  ctx.strokeStyle='#0ff';
  ctx.lineWidth=3;
  ctx.strokeRect(0,530,c.width,70);
  
  // Глаз
  drawEye();
  
  // Игрок
  drawPlayer();
  
  // Препятствия
  obstacles.forEach(o=>{
    if(o.type==='laser'){
      let alpha=o.life/60;
      ctx.fillStyle=`rgba(255,0,0,${alpha})`;
      ctx.fillRect(0,o.y-10,c.width,o.h+20);
      ctx.strokeStyle=`rgba(255,255,255,${alpha})`;
      ctx.lineWidth=2;
      ctx.strokeRect(0,o.y-10,c.width,o.h+20);
    }else if(o.type==='spike'){
      ctx.fillStyle='#f04';
      ctx.beginPath();
      ctx.moveTo(o.x,o.y+o.h);
      ctx.lineTo(o.x+o.w/2,o.y);
      ctx.lineTo(o.x+o.w,o.y+o.h);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle='#fff';
      ctx.lineWidth=2;
      ctx.stroke();
    }else if(o.type==='wave'){
      ctx.fillStyle='#f0f';
      ctx.fillRect(o.x,o.y,o.w,o.h);
      ctx.strokeStyle='#fff';
      ctx.lineWidth=3;
      ctx.strokeRect(o.x,o.y,o.w,o.h);
    }
  });
  
  // Частицы
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/60;
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,4,4);
  });
  ctx.globalAlpha=1;
  
  // UI
  ctx.fillStyle='#0ff';
  ctx.font='bold 32px Arial';
  ctx.textAlign='left';
  ctx.fillText('Счет: '+score,20,40);
  
  // Стартовый экран
  if(!gameStarted){
    ctx.fillStyle='rgba(0,0,0,0.9)';
    ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle='#0ff';
    ctx.font='bold 64px Arial';
    ctx.textAlign='center';
    ctx.fillText('iSpy CLONE',c.width/2,c.height/2-50);
    ctx.font='24px Arial';
    ctx.fillStyle='#fff';
    ctx.fillText('Кликни или нажми ПРОБЕЛ',c.width/2,c.height/2+20);
  }
  
  // Game Over
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.85)';
    ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle='#f00';
    ctx.font='bold 72px Arial';
    ctx.textAlign='center';
    ctx.fillText('ПОЙМАН!',c.width/2,c.height/2-30);
    ctx.fillStyle='#fff';
    ctx.font='32px Arial';
    ctx.fillText('Счет: '+score,c.width/2,c.height/2+30);
    ctx.font='24px Arial';
    ctx.fillText('Кликни для рестарта',c.width/2,c.height/2+80);
  }
}

function drawEye(){
  let color=eye.phase==='idle'?'#fff':eye.phase==='warning'?'#fa0':'#f00';
  
  // Свечение
  let glow=ctx.createRadialGradient(eye.x,eye.y,0,eye.x,eye.y,eye.r*2);
  glow.addColorStop(0,color+'80');
  glow.addColorStop(1,'transparent');
  ctx.fillStyle=glow;
  ctx.fillRect(eye.x-eye.r*2,eye.y-eye.r*2,eye.r*4,eye.r*4);
  
  // Вены
  ctx.strokeStyle=color;
  eye.veins.forEach(v=>{
    ctx.lineWidth=v.width;
    ctx.beginPath();
    ctx.moveTo(eye.x,eye.y);
    let endX=eye.x+Math.cos(v.angle)*(eye.r+v.length+eye.pulse);
    let endY=eye.y+Math.sin(v.angle)*(eye.r+v.length+eye.pulse);
    ctx.lineTo(endX,endY);
    ctx.stroke();
  });
  
  // Основной круг
  ctx.beginPath();
  ctx.arc(eye.x,eye.y,eye.r+eye.pulse,0,Math.PI*2);
  ctx.fillStyle=color;
  ctx.fill();
  ctx.strokeStyle='#000';
  ctx.lineWidth=5;
  ctx.stroke();
  
  // Зрачок
  let pupilX=eye.x+(player.x-eye.x)*0.05;
  let pupilY=eye.y+(player.y-eye.y)*0.05;
  ctx.beginPath();
  ctx.arc(pupilX,pupilY,35,0,Math.PI*2);
  ctx.fillStyle='#000';
  ctx.fill();
  
  // Блик
  ctx.beginPath();
  ctx.arc(pupilX-15,pupilY-15,12,0,Math.PI*2);
  ctx.fillStyle='#fff';
  ctx.fill();
}

function drawPlayer(){
  ctx.save();
  ctx.translate(player.x+player.w/2,player.y+player.h/2);
  ctx.rotate(player.rot*Math.PI/180);
  
  // Тень
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.fillRect(-player.w/2+3,-player.h/2+3,player.w,player.h);
  
  // Тело
  let grad=ctx.createLinearGradient(-player.w/2,-player.h/2,player.w/2,player.h/2);
  grad.addColorStop(0,'#0ff');
  grad.addColorStop(1,'#088');
  ctx.fillStyle=grad;
  ctx.fillRect(-player.w/2,-player.h/2,player.w,player.h);
  
  // Обводка
  ctx.strokeStyle='#fff';
  ctx.lineWidth=3;
  ctx.strokeRect(-player.w/2,-player.h/2,player.w,player.h);
  
  // Глаз
  ctx.fillStyle='#000';
  ctx.fillRect(8,-10,12,12);
  ctx.fillStyle='#fff';
  ctx.fillRect(12,-7,5,5);
  
  ctx.restore();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
